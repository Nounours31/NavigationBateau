[loggers]
keys=root,normalLogger

[handlers]
keys=consoleHandler,errorFileHandler,rotatingFileHandler

[formatters]
keys=standardFormatter,fullFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler


[logger_normalLogger]
level=DEBUG
handlers=rotatingFileHandler,errorFileHandler
propagate=1
qualname=NMEA


[handler_consoleHandler]
class=StreamHandler
level=NOTSET
formatter=standardFormatter
args=(sys.stdout,)


[handler_rotatingFileHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=fullFormatter
args=('%(LOG_DIR)s'+'/NMEA.log', 'a', 10485760, 10)


[handler_errorFileHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=fullFormatter
args=('%(LOG_DIR)s'+'/NMEA-error.log', 'a', 10485760, 10)



[formatter_standardFormatter]
format=%(asctime)s %(levelname)s %(name)s %(message)s
datefmt=%Y-%m-%d %H:%M:%S
class=logging.Formatter


[formatter_fullFormatter]
format=%(asctime)s %(levelname)s %(name)s %(pathname)s:%(funcName)s:%(lineno)d %(message)s
datefmt=%Y-%m-%d %H:%M:%S
class=logging.Formatter