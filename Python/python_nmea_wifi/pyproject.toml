[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mon_package"
version = "0.1.0"
description = "Mon premier package Python"
authors = [{name="Nounours31"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []


[tool.ruff]
line-length = 100
ignore = ["D203"]
show-source = true

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --cov -q"
python_files = ["*_tests.py", "*_test.py"]
python_classes = ["*test", "test*","*Test", "Test*", "*tests", "tests*","*Tests", "Tests*"]
testpaths = ['test', 'tests']
pythonpath = ["."]
