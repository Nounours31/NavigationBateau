[tool.ruff]
line-length = 100
ignore = ["D203"]
show-source = true

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --cov -q"
python_files = ["*_tests.py", "*_test.py"]
python_classes = ["*test", "test*","*Test", "Test*", "*tests", "tests*","*Tests", "Tests*"]
testpaths = ['test', 'tests']
pythonpath = ["."]
