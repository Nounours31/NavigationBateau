[loggers]
keys=root,cHeure,cAngle

[handlers]
keys=consoleHandler, fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler, fileHandler

[logger_cHeure]
level=DEBUG
handlers=consoleHandler, fileHandler
qualname=cHeure
propagate=0

[logger_cAngle]
level=DEBUG
handlers=consoleHandler, fileHandler
qualname=cAngle
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=simpleFormatter
args=('myAppLogs.log', 'a', 1024, 3, 'UTF-8')
# filename='myApp.log'
# mode='a' 
# maxBytes=1024 
# backupCount=3
# encoding='UTF-8'


[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt='%Y-%m-%d %H:%M:%S'