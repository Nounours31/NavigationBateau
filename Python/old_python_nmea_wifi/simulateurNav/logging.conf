[loggers]
keys=root,cHeureJour,cAngle,main_txt

[handlers]
keys=consoleHandler, fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler, fileHandler

[logger_cHeureJour]
level=DEBUG
handlers=consoleHandler, fileHandler
qualname=cHeureJour
propagate=0

[logger_cAngle]
level=DEBUG
handlers=consoleHandler, fileHandler
qualname=cAngle
propagate=0

[logger_main_txt]
level=INFO
handlers=consoleHandler, fileHandler
qualname=main_txt
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=simpleFormatter
args=('myAppLogs.log', 'a', 10241024, 3, 'UTF-8')
# filename='myApp.log'
# mode='a' 
# maxBytes=1024 
# backupCount=3
# encoding='UTF-8'


[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt='%Y-%m-%d %H:%M:%S'