[loggers]
keys=root,NMEA

[handlers]
keys=consoleHandler, fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler, fileHandler

[logger_NMEA]
level=INFO
handlers=consoleHandler, fileHandler
qualname=NMEA
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=simpleFormatter
args=('myAppLogs.log', 'a', 10241024, 3, 'UTF-8')
# filename='myApp.log'
# mode='a' 
# maxBytes=1024 
# backupCount=3
# encoding='UTF-8'


[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt='%Y-%m-%d %H:%M:%S'